site_name: FTIR OMNIC Map Reader
site_description: Read Thermo OMNIC .map FTIR maps in Python without OMNIC, and export them to open formats
site_url: https://ftir-omnic-map-reader.readthedocs.io/
repo_url: https://github.com/whtowbin/FTIR_OMNIC_MAP_Reader
repo_name: whtowbin/FTIR_OMNIC_MAP_Reader
edit_uri: edit/main/docs/site/
copyright: ftir-OMNIC-map-reader is released under the MIT license.

# Only this folder is published. docs/RELEASING.md (maintainer notes) stays on GitHub.
docs_dir: docs/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Map kinds: map_kinds.md
  - Metadata and images: metadata.md
  - Exports: exports.md
  - Unpacked projects:
      - unpacked.md
      - Format specification: unpacked_format.md
  - Command line: cli.md
  - File format notes: file_format.md
  - Migrating from 1.0: migrating.md
  - Python API: api.md
  - Changelog and credits: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            filters: ["!^_"]
            show_if_no_docstring: false

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
