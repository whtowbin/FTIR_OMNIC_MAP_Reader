[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftir-OMNIC-map-reader"
version = "1.1.1"
description = "Load Thermo OMNIC .map FTIR files into Python as xarray datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["FTIR", "Hyperspectral", "OMNIC", "Thermo", "spectroscopy", "xarray"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
authors = [
  { name = "Henry Towbin", email = "24940778+whtowbin@users.noreply.github.com" },
]

dependencies = [
    "matplotlib>=3.10.1",
    "numpy >= 1.26",
    "pandas>=2",
    "pillow>=10",
    "xarray>=2024.6",
    "zarr>=2.18",  # zarr 2.18 on Python 3.10, zarr 3 from 3.11: the spectra.zarr of an unpacked map
]

[project.optional-dependencies]
zarr = []  # alias kept for compatibility: zarr is a core dependency
yaml = ["pyyaml>=6"]
parquet = ["pyarrow>=14"]
netcdf = ["h5netcdf>=1.3", "h5py>=3.8"]  # wheels only, no libnetcdf: opt-in spectra.nc

[project.scripts]
ftir-map = "ftir_map.cli:main"

[project.urls]
Documentation = "https://ftir-omnic-map-reader.readthedocs.io/"
Source = "https://github.com/whtowbin/FTIR_OMNIC_MAP_Reader"
Issues = "https://github.com/whtowbin/FTIR_OMNIC_MAP_Reader/issues"
Changelog = "https://github.com/whtowbin/FTIR_OMNIC_MAP_Reader/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ftir_map"]
# the wheel holds package code only: no data files, and not the scratch script
exclude = ["*.map", "src/ftir_map/testpoint.py"]

[tool.hatch.build.targets.sdist]
# .remember holds local session notes; hatch reads only the root .gitignore, not the one inside that folder
exclude = ["tests/data", "src/*.egg-info", "dist", "TODO_local.md", ".remember"]

[dependency-groups]
dev = [
    "complexipy>=5",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "h5netcdf>=1.3",
    "h5py>=3.8",
    "pyyaml>=6",
    "pyarrow>=14",
    "types-pyyaml",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
line-length = 120
# PyMca-derived readers and scripts kept unchanged for now; new code does not depend on them.
extend-exclude = [
    "src/ftir_map/PyMca_OmnicMap.py",
    "src/ftir_map/PyMca_Array_OmnicMap.py",
    "src/ftir_map/LoadOmnicArrayMAP.py",
    "src/ftir_map/testpoint.py",
]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ty.src]
# deprecated PyMca-derived code, removed in 2.0; the scratch script is not part of the wheel
exclude = [
    "src/ftir_map/PyMca_OmnicMap.py",
    "src/ftir_map/PyMca_Array_OmnicMap.py",
    "src/ftir_map/LoadOmnicArrayMAP.py",
    "src/ftir_map/testpoint.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# public names kept for backward compatibility
"src/ftir_map/LoadOmnicMAP.py" = ["N999", "N802"]
